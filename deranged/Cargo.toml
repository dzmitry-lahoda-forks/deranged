[package]
name = "deranged"
version = "0.5.9"
authors = ["Jacob Pratt <jacob@jhpratt.dev>"]
edition = "2021"
rust-version = "1.85.0"
repository = "https://github.com/jhpratt/deranged"
keywords = ["integer", "int", "range"]
readme = "../README.md"
license = "MIT OR Apache-2.0"
description = "Ranged integers"
include = ["src/**/*", "LICENSE-*", "README.md"]

[features]
default = [] # no defaults
alloc = []
arbitrary = ["dep:arbitrary"]
bytemuck = ["dep:bytemuck"]
borsh = ["dep:borsh"]
borsh_schema = ["borsh", "borsh/unstable__schema"]
macros = ["dep:deranged-macros"]
num = ["dep:num-traits"]
powerfmt = ["dep:powerfmt"]
proptest = ["dep:proptest"]
prost-types = ["dep:prost-types"]
quickcheck = ["dep:quickcheck", "alloc"]
rand = ["rand08", "rand09", "rand010"]
rand08 = ["dep:rand08"]
rand09 = ["dep:rand09"]
rand010 = ["dep:rand010"]
serde = ["dep:serde_core"]
schemars = ["dep:schemars", "alloc"]
# Please note that we assume u32/u64 values appear in the API
# and are limited to u31/u63.
# But because we unconditionally map them to i32/i64 PG types,
# this leaves an unsoundness hole.
# To fix this, we can use witness types (or use nightly).
sqlx09-pg = ["dep:sqlx09", "alloc", "dep:num-traits"]
zerocopy = ["dep:zerocopy", "dep:zerocopy-derive"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]
rustdoc-args = ["--generate-link-to-definition", "--generate-macro-expansion"]

[dependencies]
deranged-macros = { workspace = true, optional = true }
arbitrary = { version = "1.4.2", optional = true, default-features = false }
bytemuck = { version = "1.13.1", optional = true, default-features = false }
borsh = { version = "1.6.1", optional = true, default-features = false }
num-traits = { version = "0.2.15", optional = true, default-features = false }
powerfmt = { version = "0.2.0", optional = true, default-features = false }
proptest = { version = "1.11.0", optional = true, default-features = false, features = ["alloc", "no_std"] }
quickcheck = { version = "1.0.3", default-features = false, optional = true }
rand08 = { package = "rand", version = "0.8.4", optional = true, default-features = false }
rand09 = { package = "rand", version = "0.9.0", optional = true, default-features = false }
rand010 = { package = "rand", version = "0.10.0", optional = true, default-features = false }
serde_core = { version = "1.0.220", optional = true, default-features = false }
zerocopy = { version = "0.8.31", optional = true, default-features = false }
zerocopy-derive = { version = "0.8.31", optional = true, default-features = false }
schemars = { version = "1.2.1", optional = true, default-features = false }
sqlx09 = { package = "sqlx", version = "0.9.0-alpha.1", optional = true, features = [ "postgres", "bigdecimal" ], default-features = false }
prost-types = { version = "0.14.1", optional = true, default-features = false }

[dev-dependencies]
arbitrary = "1.4.2"
atomic = "0.6.1"
rand08 = { package = "rand", version = "0.8.4" }
rand09 = { package = "rand", version = "0.9.0" }
rand010 = { package = "rand", version = "0.10.0" }
proptest = "1.11.0"
prost = { version = "0.14.1", default-features = false }
serde_json = "1.0.86"
